<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heat - Markers Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <script src="/theme-loader.js"></script>
  <script src="/heat-client.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body, 'Courier New', monospace);
      background: var(--color-background, #0a0a0a);
      color: var(--color-text, #fff);
      overflow: hidden;
    }

    .marker {
      position: absolute;
      width: 32px;
      height: 32px;
      transform: translate(-16px, -32px);
      pointer-events: none;
      transition: all 0.3s ease-out;
    }

    .marker svg {
      filter: drop-shadow(0 2px 8px rgba(0,255,136,0.3));
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(26, 26, 26, 0.9);
      border: 2px solid var(--color-border, #004400);
      border-radius: var(--effect-border-radius, 12px);
      padding: 15px 20px;
      font-size: 14px;
      z-index: 100;
      backdrop-filter: blur(var(--effect-backdrop-blur, 10px));
    }

    #info .panel-label {
      display: block;
      font-family: var(--font-heading, 'Orbitron', monospace);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--color-primary, #00ff88);
      text-shadow: var(--glow-text, 0 0 8px rgba(0,255,136,0.8));
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      background: var(--color-status-disconnected, #ff4444);
    }

    .status.connected {
      background: var(--color-status-connected, #00ff88);
      box-shadow: 0 0 8px var(--color-status-connected, #00ff88);
      animation: neon-pulse 2s ease-in-out infinite;
    }

    @keyframes neon-pulse {
      0%, 100% { box-shadow: 0 0 8px var(--color-status-connected, #00ff88); }
      50% { box-shadow: 0 0 2px var(--color-status-connected, #00ff88); }
    }
  </style>
</head>
<body>
  <div id="info">
    <span class="panel-label">Markers</span>
    <span class="status" id="status"></span>
    <span id="statusText">Connecting...</span>
  </div>

  <script>
    const channelId = getChannelFromURL('channel', '12345');
    const markers = new Map();

    // Create Heat client
    const heat = new HeatClient(channelId, {
      apiUrl: 'ws://localhost:7777',
      debugMode: true,
    });

    // Connection status
    heat.on('connected', () => {
      document.getElementById('status').classList.add('connected');
      document.getElementById('statusText').textContent = 'Markers Demo - Click anywhere!';
    });

    heat.on('disconnected', () => {
      document.getElementById('status').classList.remove('connected');
      document.getElementById('statusText').textContent = 'Disconnected';
    });

    // Handle clicks
    heat.on('click', (e) => {
      const data = e.detail;
      updateMarker(data.id, parseFloat(data.x), parseFloat(data.y));
    });

    // Create or update marker
    function updateMarker(userId, x, y) {
      let marker = markers.get(userId);

      if (!marker) {
        marker = createMarkerElement();
        document.body.appendChild(marker);
        markers.set(userId, marker);
      }

      // Update position
      marker.style.left = (x * window.innerWidth) + 'px';
      marker.style.top = (y * window.innerHeight) + 'px';
    }

    // Create marker SVG element
    function createMarkerElement() {
      const marker = document.createElement('div');
      marker.className = 'marker';

      // Random color for each user — biased toward the theme primary if available
      const hue = Math.random() * 360;
      const color = `hsl(${hue}, 70%, 60%)`;
      const stroke = (window.HeatTheme && window.HeatTheme.colors.primary) || '#00ff88';

      marker.innerHTML = `
        <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2C10.5 2 6 6.5 6 12c0 7 10 18 10 18s10-11 10-18c0-5.5-4.5-10-10-10z"
                fill="${color}" stroke="${stroke}" stroke-width="2"/>
          <circle cx="16" cy="12" r="4" fill="white"/>
        </svg>
      `;

      return marker;
    }

    // Capture local clicks
    capturePageClicks(heat);
  </script>
</body>
</html>
